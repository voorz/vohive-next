name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      enable_upx:
        description: 'Enable UPX compression (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: binary-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Build frontend assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend assets
        shell: bash
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.artifact_arch }}
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goarm: ''
            artifact_arch: amd64
          - goarch: arm64
            goarm: ''
            artifact_arch: arm64
          - goarch: arm
            goarm: '7'
            artifact_arch: armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure Git for private modules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "${GH_PAT}" ]; then
            # Configure auth for voorz private modules
            git config --global url."https://x-access-token:${GH_PAT}@github.com/voorz/".insteadOf "https://github.com/voorz/"
            go env -w GOPRIVATE=github.com/voorz/*
            go env -w GONOSUMDB=github.com/voorz/*
          fi

      - name: Prepare build vars
        id: vars
        shell: bash
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          BUILDTIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          REVISION="${GITHUB_SHA}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ENABLE_UPX_RAW="${{ github.event.inputs.enable_upx }}"
          else
            ENABLE_UPX_RAW="true"
          fi

          case "${ENABLE_UPX_RAW}" in
            false|0|no|off) ENABLE_UPX=0 ;;
            *) ENABLE_UPX=1 ;;
          esac

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "buildtime=${BUILDTIME}" >> "${GITHUB_OUTPUT}"
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"
          echo "enable_upx=${ENABLE_UPX}" >> "${GITHUB_OUTPUT}"

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Sync frontend dist for embed
        shell: bash
        run: |
          rm -rf internal/web/dist
          cp -R web/dist internal/web/dist

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} \
            go build -trimpath -buildvcs=false -tags "with_utls" \
            -ldflags "-s -w -X 'github.com/voorz/vohive/internal/global.Version=${{ steps.vars.outputs.version }}' -X 'github.com/voorz/vohive/internal/global.BuildTime=${{ steps.vars.outputs.buildtime }}'" \
            -o dist/vo-hive ./cmd/vohive

      - name: Install UPX
        if: ${{ steps.vars.outputs.enable_upx == '1' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl || sudo apt-get install -y upx

      - name: Compress with UPX
        if: ${{ steps.vars.outputs.enable_upx == '1' }}
        shell: bash
        run: |
          upx --best --lzma dist/vo-hive || upx -9 dist/vo-hive

      - name: Package artifacts
        shell: bash
        run: |
          OUT="vohive_v${{ steps.vars.outputs.version }}_linux_${{ matrix.artifact_arch }}"
          mkdir -p out
          cp dist/vo-hive "out/${OUT}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.artifact_arch }}
          path: out/*
          retention-days: 3

  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare release vars
        id: release_vars
        shell: bash
        run: |
          RELEASE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"

          # Assemble release body — write to file to avoid bash interpreting backticks/special chars
          RELEASE_NOTES_FILE="$(mktemp)"
          {
            echo "# v${VERSION}"
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Architecture | Platform | File |"
            echo "|------|---------|------|"
            echo "| amd64 | WSL / x86_64 Linux | \`vohive_v${VERSION}_linux_amd64\` |"
            echo "| arm64 | OpenWrt aarch64 / ARM64 Linux | \`vohive_v${VERSION}_linux_arm64\` |"
            echo "| armv7 | OpenWrt armv7 / Embedded devices | \`vohive_v${VERSION}_linux_armv7\` |"
            echo ""
            echo "## Docker"
            echo ""
            echo '```bash'
            echo "docker pull voorz/vohive:${VERSION}"
            echo "docker pull ghcr.io/voorz/vohive-release/vohive:${VERSION}"
            echo '```'
          } > "${RELEASE_NOTES_FILE}"
          echo "notes_file=${RELEASE_NOTES_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Publish to GitHub Release (cross-repo)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          RELEASE_REPO="voorz/vohive-release"
          TAG="v${VERSION}"
          NOTES_FILE="${{ steps.release_notes.outputs.notes_file }}"
          
          # Create release using --notes-file to avoid bash interpreting special chars in notes
          gh release create "${TAG}" \
            --repo "${RELEASE_REPO}" \
            --title "v${VERSION}" \
            --notes-file "${NOTES_FILE}" \
            --target master
          
          # Upload each binary asset
          for f in dist/*; do
            echo "Uploading $(basename "$f")..."
            gh release upload "${TAG}" "$f" \
              --repo "${RELEASE_REPO}" --clobber
          done
          
          # Cleanup temp file
          rm -f "${NOTES_FILE}"
          echo "Release published to https://github.com/${RELEASE_REPO}/releases/tag/${TAG}"

      - name: Send Telegram notification
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          RELEASE_URL="https://github.com/voorz/vohive-release/releases/tag/v${VERSION}"
          MESSAGE=$(printf "vohive release v%s\n\n%s" "${VERSION}" "${RELEASE_URL}")
          curl -fsSL -X POST "${API}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=${MESSAGE}"
